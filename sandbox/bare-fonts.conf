<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Simulates a device with no font for the target script. Liberation is Latin/Greek/Cyrillic only.
     (DejaVu is NOT used: DejaVu Sans contains the Lao block.) -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <cachedir>/tmp/.cache/fontconfig-bare</cachedir>
  <config><rescan><int>0</int></rescan></config>
</fontconfig>
