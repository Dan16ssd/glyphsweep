<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Simulates a device with no font for the target script: only DejaVu is visible. -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <cachedir>/tmp/.cache/fontconfig-bare</cachedir>
  <config><rescan><int>0</int></rescan></config>
</fontconfig>
