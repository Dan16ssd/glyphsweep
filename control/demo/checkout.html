<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Checkout — ຊຳລະເງິນ</title>
<style>
  body { margin: 0; font-family: "Poppins", Helvetica, sans-serif; background: #faf6f0; color: #2b1d14; }
  .wrap { max-width: 640px; margin: 40px auto; background: #fff; padding: 28px; border-radius: 12px; }
  h1 { font-size: 30px; line-height: 1.15; margin: 0 0 18px; }
  label { display: block; font-size: 15px; margin: 14px 0 4px; text-transform: uppercase; letter-spacing: .08em; }
  input { width: 100%; padding: 8px; font-size: 16px; box-sizing: border-box; }
  .note { font-size: 14px; height: 18px; line-height: 18px; overflow: hidden; color: #7a5a44; }
  button { margin-top: 20px; padding: 10px 18px; background: #3b2416; color: #fff; border: 0; border-radius: 6px; font-size: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ຊຳລະເງິນ ແລະ ຢືນຢັນການສັ່ງຊື້</h1>
  <label>ຊື່ ແລະ ນາມສະກຸນ</label><input placeholder="Full name">
  <label>ເບີໂທລະສັບ</label><input placeholder="Phone number">
  <label>ທີ່ຢູ່ຈັດສົ່ງ</label><input placeholder="Delivery address">
  <div class="note">ພວກເຮົາຈະໂທຫາທ່ານເພື່ອຢືນຢັນກ່ອນຈັດສົ່ງ ພາຍໃນ 24 ຊົ່ວໂມງ</div>
  <button>Place order</button>
  <p><a href="shop.html">ກັບຄືນໜ້າຫຼັກ</a> · Payment by BCEL OnePay or cash on delivery</p>
</div>
</body>
</html>
