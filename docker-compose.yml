services:
  control:
    build: ./control
    image: glyphsweep-control:latest
    ports:
      - "80:8000"
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gsdata:/data
    networks:
      gs-egress:
        aliases: [glyphsweep-demo]   # bundled demo site, reachable by the per-job proxy
    restart: unless-stopped

  # Build-only images; the control plane starts one of each per job stage.
  sandbox:
    build: ./sandbox
    image: glyphsweep-sandbox:latest
    profiles: ["build"]
  proxy:
    build: ./proxy
    image: glyphsweep-proxy:latest
    profiles: ["build"]

networks:
  gs-egress:
    name: gs-egress
  gs-internal:
    name: gs-internal
    internal: true

volumes:
  gsdata:
