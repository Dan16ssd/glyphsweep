services:
  control:
    build: ./control
    image: glyphsweep-control:latest
    expose: ["8000"]
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gsdata:/data
    networks: [gs-egress]
    restart: unless-stopped

  # TLS front door. GS_DOMAIN=<ip-with-dashes>.sslip.io gets a real Let's Encrypt cert; empty = plain :80.
  caddy:
    image: caddy:2.8.4
    command: ["caddy", "reverse-proxy", "--from", "${GS_DOMAIN:-:80}", "--to", "control:8000"]
    ports: ["80:80", "443:443"]
    volumes: [caddydata:/data]
    networks: [gs-egress]
    depends_on: [control]
    restart: unless-stopped

  # Hostile demo shop in its OWN static container: hostile JS in the sandbox can never reach
  # the control plane. Read-only, unprivileged, no Docker socket, no secrets.
  demo:
    image: python:3.12-slim
    command: ["python", "-m", "http.server", "8000", "--directory", "/srv", "--bind", "0.0.0.0"]
    volumes:
      - ./control/demo:/srv/demo:ro
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    networks:
      gs-egress:
        aliases: [glyphsweep-demo]
    restart: unless-stopped

  # Build-only images; the control plane starts one of each per job stage.
  sandbox:
    build: ./sandbox
    image: glyphsweep-sandbox:latest
    profiles: ["build"]
  proxy:
    build: ./proxy
    image: glyphsweep-proxy:latest
    profiles: ["build"]

networks:
  gs-egress:
    name: gs-egress
  gs-internal:
    name: gs-internal
    internal: true

volumes:
  gsdata:
  caddydata:
